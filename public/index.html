<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 ارسم وخمن</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- شاشة الدخول -->
<div id="login">
  <h1>🎨 ارسم وخمن</h1>
  <input id="nameInput" placeholder="سميتك..." maxlength="15">
  <input id="roomInput" placeholder="كود الغرفة..." maxlength="15">
  <button id="joinBtn">دخول</button>
</div>

<!-- اللعبة -->
<div id="game" style="display:none">
  <header>
    <div id="roomInfo">🏠 الغرفة: <span id="roomCode"></span></div>
    <div id="timerDisplay">⏰ 80</div>
    <div id="wordDisplay">الكلمة: <span id="wordHint">-</span></div>
  </header>

  <main>
    <aside id="sidebar">
      <h3>👥 اللاعبين</h3>
      <ul id="playerList"></ul>
      <hr>
      <h3>💬 الدردشة</h3>
      <div id="chatBox"></div>
      <div id="guessArea">
        <input id="guessInput" placeholder="خمن الكلمة..." maxlength="30">
        <button id="guessBtn">إرسال</button>
      </div>
    </aside>

    <section id="canvasArea">
      <canvas id="canvas" width="800" height="600"></canvas>
      <div id="toolbar">
        <button class="color" data-color="#000000" style="background:#000"></button>
        <button class="color" data-color="#e74c3c" style="background:#e74c3c"></button>
        <button class="color" data-color="#3498db" style="background:#3498db"></button>
        <button class="color" data-color="#2ecc71" style="background:#2ecc71"></button>
        <button class="color" data-color="#f39c12" style="background:#f39c12"></button>
        <button class="color" data-color="#9b59b6" style="background:#9b59b6"></button>
        <input type="range" id="brushSize" min="1" max="30" value="5">
        <button id="eraserBtn">🧽 ممحاة</button>
        <button id="clearBtn">🗑️ مسح</button>

      </div>
    </section>
  </main>
  <div id="micPanel">
    <button id="micBtn">🎤 تشغيل المايك</button>
    <span id="micStatus">المايك مطفي</span>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="client.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>🎨 ارسم وخمن</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- شاشة الدخول -->
<div id="login">
  <h1>🎨 ارسم وخمن</h1>
  <input id="nameInput" placeholder="سميتك..." maxlength="15" autocomplete="off">
  <input id="roomInput" placeholder="كود الغرفة..." maxlength="15" autocomplete="off">
  <button id="joinBtn">دخول</button>
</div>

<!-- اللعبة -->
<div id="game" style="display:none">
  <header>
    <div id="roomInfo">🏠 <span id="roomCode"></span></div>
    <div id="timerDisplay">⏰ 120</div>
    <div id="wordDisplay">
      <img id="logoPreview" style="display:none;" alt="logo" />
      <span id="wordHint">-</span>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <h3>👥 اللاعبين</h3>
      <ul id="playerList"></ul>
      <h3>💬 الدردشة</h3>
      <div id="chatBox"></div>
      <div id="guessArea">
        <input id="guessInput" placeholder="خمن الكلمة..." maxlength="30" autocomplete="off">
        <button id="guessBtn">إرسال</button>
      </div>
    </aside>

    <section id="canvasArea">
      <canvas id="canvas"></canvas>

      <div id="toolbar">
        <button class="color" data-color="#000000" style="background:#000"></button>
        <button class="color" data-color="#ffffff" style="background:#fff;border:2px solid #888"></button>
        <button class="color" data-color="#e74c3c" style="background:#e74c3c"></button>
        <button class="color" data-color="#e67e22" style="background:#e67e22"></button>
        <button class="color" data-color="#f1c40f" style="background:#f1c40f"></button>
        <button class="color" data-color="#2ecc71" style="background:#2ecc71"></button>
        <button class="color" data-color="#1abc9c" style="background:#1abc9c"></button>
        <button class="color" data-color="#3498db" style="background:#3498db"></button>
        <button class="color" data-color="#9b59b6" style="background:#9b59b6"></button>
        <button class="color" data-color="#e91e63" style="background:#e91e63"></button>
        <button class="color" data-color="#8b4513" style="background:#8b4513"></button>
        <button class="color" data-color="#95a5a6" style="background:#95a5a6"></button>

        <input type="range" id="brushSize" min="1" max="50" value="5">

        <button id="penBtn" class="tool-btn on" title="قلم">✏️</button>
        <button id="lineBtn" class="tool-btn" title="خط">📏</button>
        <button id="rectBtn" class="tool-btn" title="مستطيل">⬜</button>
        <button id="circleBtn" class="tool-btn" title="دائرة">⭕</button>
        <button id="fillBtn" class="tool-btn" title="ملء">🎨</button>
        <button id="eraserBtn" class="tool-btn" title="ممحاة">🧽</button>
        <button id="undoBtn" class="tool-btn" title="تراجع">↩️</button>
        <button id="redoBtn" class="tool-btn" title="إعادة">↪️</button>
        <button id="clearBtn">🗑️ مسح</button>
      </div>
    </section>
  </main>

  <div id="micPanel">
    <button id="micBtn">🎤 تشغيل المايك</button>
    <span id="micStatus">المايك مطفي</span>
  </div>

  <div id="musicPanel">
    <button id="musicBtn">🎵 تشغيل</button>
    <input type="range" id="musicVolume" min="0" max="100" value="50" />
    <select id="musicSelect">
      <option value="dl.mp3">🎵 الأغنية</option>
    </select>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/peerjs.min.js"></script>
<script src="client.js"></script>
</body>
</html>
